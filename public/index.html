<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ MINTBOT — 批量 Mint NFT</title>
<style>
  :root {
    --bg: #070b14;
    --bg2: #0b1222;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.09);
    --neon: #22d3ee;
    --neon2: #a78bfa;
    --ok: #34d399;
    --err: #f87171;
    --warn: #fbbf24;
    --txt: #e2e8f0;
    --dim: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    background: radial-gradient(1000px 500px at 85% -10%, rgba(167,139,250,0.16), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(34,211,238,0.12), transparent 60%),
                var(--bg);
    color: var(--txt);
    padding-bottom: 40px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ===== Nav ===== */
  nav {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 0; margin-bottom: 6px;
  }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .logo .bolt { background: linear-gradient(135deg, var(--neon), var(--neon2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo small { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 8px; }
  .spacer { flex: 1; }
  #connBtn {
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    border: none; color: #06090f; font-weight: 700; font-size: 13px;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    font-family: inherit; transition: filter .15s;
  }
  #connBtn:hover { filter: brightness(1.15); }
  #connBtn.connected { background: rgba(52,211,153,0.15); color: var(--ok); border: 1px solid rgba(52,211,153,0.4); }
  #connBtn .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:8px; }

  /* ===== Stats ===== */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
  .stat {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat .num { font-size: 26px; font-weight: 800; }
  .stat .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  #stTotal { color: var(--txt); }
  #stOk { color: var(--ok); }
  #stFail { color: var(--err); }
  #stRun { color: var(--warn); }

  /* ===== Layout ===== */
  .grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2,1fr); } }
  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 20px; backdrop-filter: blur(8px);
  }
  .card h2 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 16px; display:flex; align-items:center; gap:8px; }
  .card h2 .bar { width: 4px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, var(--neon), var(--neon2)); }

  .fld { margin-bottom: 14px; }
  .fld label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 6px; letter-spacing: .5px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--card-border);
    color: var(--txt); border-radius: 9px; padding: 9px 11px; font-size: 13px;
    font-family: inherit; outline: none; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--neon); }
  textarea { resize: vertical; min-height: 80px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 5px; line-height: 1.5; }

  .mode-switch { display: flex; gap: 8px; margin-bottom: 14px; }
  .mode-switch button {
    flex: 1; padding: 9px; border-radius: 9px; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700; background: rgba(0,0,0,0.3);
    border: 1px solid var(--card-border); color: var(--dim); transition: all .15s;
  }
  .mode-switch button.active { border-color: var(--neon); color: var(--neon); background: rgba(34,211,238,0.08); }

  .sec-label { font-size: 11px; color: var(--dim); margin: 16px 0 8px; letter-spacing: 1px; }

  /* ===== Buttons ===== */
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 11px; border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 800; letter-spacing: .5px;
    transition: filter .15s, transform .05s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(135deg, var(--neon), var(--neon2)); color: #06090f; }
  .btn-primary:hover { filter: brightness(1.12); }
  .btn-primary:disabled { filter: grayscale(.6) brightness(.6); cursor: not-allowed; }
  .btn-ghost { background: rgba(255,255,255,0.06); color: var(--txt); border: 1px solid var(--card-border); }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); }
  .btn-danger { background: rgba(248,113,113,0.12); color: var(--err); border: 1px solid rgba(248,113,113,0.35); }

  /* ===== Progress ===== */
  .prog-track { height: 14px; border-radius: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); overflow: hidden; margin: 12px 0 8px; }
  .prog-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    background-size: 200% 100%; animation: shimmer 1.6s linear infinite;
    transition: width .25s ease; border-radius: 8px;
  }
  @keyframes shimmer { 0% {background-position: 0% 0;} 100% {background-position: 200% 0;} }
  .prog-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }

  /* ===== Log ===== */
  .log {
    margin-top: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
    border-radius: 11px; padding: 10px; height: 320px; overflow-y: auto;
    font-size: 11.5px; line-height: 1.7;
  }
  .log .t { color: #475569; margin-right: 8px; }
  .log .ok { color: var(--ok); }
  .log .err { color: var(--err); }
  .log .warn { color: var(--warn); }
  .log .info { color: var(--neon); }
  .log .dim { color: var(--dim); }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

  .foot { margin-top: 26px; font-size: 11px; color: var(--dim); line-height: 1.8; text-align: center; }
  .foot b { color: var(--warn); }
  .tag { display:inline-block; background: rgba(34,211,238,0.1); color: var(--neon); border:1px solid rgba(34,211,238,0.3); border-radius:6px; padding:1px 7px; font-size:10px; margin-left:6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <div class="logo"><span class="bolt">⚡ MINTBOT</span><small>批量 Mint NFT 控制台</small></div>
    <div class="spacer"></div>
    <button id="connBtn">连接钱包</button>
  </nav>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat"><span class="num" id="stTotal">0</span><span class="lbl">总任务</span></div>
    <div class="stat"><span class="num" id="stOk">0</span><span class="lbl">成功</span></div>
    <div class="stat"><span class="num" id="stFail">0</span><span class="lbl">失败</span></div>
    <div class="stat"><span class="num" id="stRun">0</span><span class="lbl">进行中</span></div>
  </div>

  <div class="grid">
    <!-- ============ 配置面板 ============ -->
    <div class="card">
      <h2><span class="bar"></span>① 任务配置</h2>

      <div class="fld">
        <label>网络（Chain）</label>
        <select id="chainSel"></select>
      </div>
      <div class="row" id="customRpcRow">
        <div class="fld"><label>RPC URL</label><input type="text" id="rpcUrl" placeholder="https://..."></div>
        <div class="fld"><label>Chain ID</label><input type="text" id="rpcChainId" placeholder="如 4663"></div>
      </div>
      <div class="row">
        <div class="fld"><label>浏览器 (区块浏览器 /tx/ 前缀，可留空)</label><input type="text" id="explorer" placeholder="https://explorer..."></div>
        <div class="fld"><label>代币符号</label><input type="text" id="symbol" placeholder="ETH / ROBIN / GIWA"></div>
      </div>

      <div class="fld">
        <label>合约预设</label>
        <select id="contractPreset">
          <option value="">— 自定义合约 —</option>
          <option value="poap">🎖️ POAP Attendance（GIWA Testnet 0x8Cd7...0d1c）</option>
          <option value="ia">👼 Inference Angels（Robinhood 0xD982...1f9，需谜题不适合本页）</option>
        </select>
      </div>
      <div class="fld">
        <label>合约地址</label>
        <input type="text" id="contractAddr" placeholder="0x...">
      </div>

      <div class="fld">
        <label>Mint 函数（内置常用签名）</label>
        <select id="fnSel">
          <option value="mint_uint">mint(uint256) — 数量参数</option>
          <option value="mint_uint_addr">mint(uint256,address) — 数量+接收地址</option>
          <option value="publicMint_uint">publicMint(uint256)</option>
          <option value="mint_addr_uint">mint(address,uint256) — 接收地址+数量</option>
          <option value="claim">claim() — 无参数</option>
          <option value="freeMint">freeMint() — 无参数</option>
          <option value="mintPOAP_str">mintPOAP(string) — 名字参数（POAP）</option>
          <option value="custom">⚙️ 自定义 ABI（粘贴 JSON）</option>
        </select>
      </div>

      <div class="fld hidden" id="customAbiRow">
        <label>ABI JSON（数组，含目标函数）+ 函数名 + 参数</label>
        <textarea id="customAbi" placeholder='[{"inputs":[],"name":"mint","outputs":[],"stateMutability":"payable","type":"function"}]'></textarea>
        <div class="row" style="margin-top:8px;">
          <div class="fld"><label>函数名</label><input type="text" id="customFn" placeholder="mint"></div>
          <div class="fld"><label>参数 JSON（数组）</label><input type="text" id="customArgs" placeholder='["0x...", 5]'></div>
        </div>
      </div>

      <div class="sec-label">批量参数</div>
      <div class="row3">
        <div class="fld"><label>单次数量（uint 参数值）</label><input type="number" id="qtyArg" value="1" min="1"></div>
        <div class="fld"><label>每钱包调用次数</label><input type="number" id="callsPerWallet" value="1" min="1"></div>
        <div class="fld"><label>并发数</label><input type="number" id="concurrency" value="5" min="1" max="30"></div>
      </div>
      <div class="row">
        <div class="fld"><label>每笔 ETH 价值（免费填 0）</label><input type="text" id="valueEth" value="0" placeholder="0"></div>
        <div class="fld"><label>Gas 倍率（auto 基础 × 倍数）</label><input type="number" id="gasMult" value="1.2" step="0.1" min="1"></div>
      </div>
      <div class="fld hidden" id="nameRow">
        <label>名字列表（每行一个；POAP 每地址只能 mint 一次，数量=钱包数）</label>
        <textarea id="namesList" placeholder="Alice&#10;Bob&#10;留空则自动 Wallet-1, Wallet-2 ..."></textarea>
      </div>

      <div class="sec-label">钱包来源</div>
      <div class="mode-switch">
        <button id="modeA" class="active">🔗 连接钱包（单钱包循环）</button>
        <button id="modeB">📦 批量私钥（每钱包各 mint）</button>
      </div>
      <div class="fld hidden" id="keysRow">
        <label>私钥列表（每行一个，可带 0x 前缀，# 开头为注释）</label>
        <textarea id="keysList" placeholder="0xabc...&#10;0xdef...&#10;# 注释行"></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="startBtn">▶ 开始批量 Mint</button>
        <button class="btn btn-danger hidden" id="stopBtn">■ 停止</button>
        <button class="btn btn-ghost" id="testBtn">🔌 测试 RPC</button>
      </div>
    </div>

    <!-- ============ 运行面板 ============ -->
    <div class="card">
      <h2><span class="bar"></span>② 运行状态</h2>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-meta"><span id="progText">等待开始</span><span id="progPct">0%</span></div>
      <div class="actions" style="margin-top:10px;">
        <button class="btn btn-ghost" id="copyFailBtn">📋 复制失败列表</button>
        <button class="btn btn-ghost" id="clearLogBtn">🧹 清空日志</button>
      </div>
      <div class="log" id="logBox"></div>
    </div>
  </div>

  <div class="foot">
    🔒 私钥仅在本机浏览器内处理，<b>不会上传到任何服务器</b>（纯前端 + 直连 RPC）。<br>
    建议通过本地服务打开：<b>python3 -m http.server 8787</b> 然后访问 <b>http://localhost:8787</b><br>
    批量模式每个钱包顺序执行（本地 nonce 递增），钱包之间并行（并发数可调）。中途停止会留下部分 pending 交易，请留意。
  </div>
</div>

<script>
/* ethers.js 多 CDN 兜底加载 */
(function () {
  var srcs = [
    'https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js',
    'https://unpkg.com/ethers@6.13.4/dist/ethers.umd.min.js'
  ];
  var i = 0;
  function load() {
    if (i >= srcs.length) return;
    var s = document.createElement('script');
    s.src = srcs[i++];
    s.onload = function () { window.__ethersLoaded = true; };
    s.onerror = function () { load(); };
    document.head.appendChild(s);
  }
  load();
})();
</script>
<script>
'use strict';
/* ============================================================
   MINTBOT — 批量 Mint NFT 控制台（纯前端）
   模式 A：连接钱包，单钱包循环 mint
   模式 B：粘贴私钥列表，每个钱包各自 mint（并发）
   ============================================================ */

const $ = id => document.getElementById(id);

/* ---------- 网络预设 ---------- */
const CHAINS = [
  { id: 91342, name: 'GIWA Testnet',       rpc: 'https://sepolia-rpc.giwa.io',                 explorer: '',        symbol: 'GIWA' },
  { id: 4663,  name: 'Robinhood Chain',    rpc: 'https://rpc.mainnet.chain.robinhood.com',     explorer: '',        symbol: 'ROBIN' },
  { id: 1,     name: 'Ethereum',           rpc: 'https://eth.llamarpc.com',                    explorer: 'https://etherscan.io',  symbol: 'ETH' },
  { id: 8453,  name: 'Base',               rpc: 'https://mainnet.base.org',                    explorer: 'https://basescan.org',   symbol: 'ETH' },
  { id: 42161, name: 'Arbitrum One',       rpc: 'https://arb1.arbitrum.io/rpc',                explorer: 'https://arbiscan.io',    symbol: 'ETH' },
  { id: 137,   name: 'Polygon PoS',        rpc: 'https://polygon-rpc.com',                     explorer: 'https://polygonscan.com', symbol: 'POL' },
  { id: 0,     name: '⚙️ 自定义 RPC',     rpc: '',                                             explorer: '',        symbol: '' },
];

/* ---------- 常用 mint 函数 ABI ---------- */
const FN_ABI = {
  mint_uint:        ['function mint(uint256 quantity)'],
  mint_uint_addr:   ['function mint(uint256 quantity, address to)'],
  publicMint_uint:  ['function publicMint(uint256 quantity)'],
  mint_addr_uint:   ['function mint(address to, uint256 quantity)'],
  claim:            ['function claim()'],
  freeMint:         ['function freeMint()'],
  mintPOAP_str:     ['function mintPOAP(string name)'],
};
const FN_ARGS = {
  mint_uint:        w => [qtyArg()],
  mint_uint_addr:   w => [qtyArg(), w],
  publicMint_uint:  w => [qtyArg()],
  mint_addr_uint:   w => [w, qtyArg()],
  claim:            w => [],
  freeMint:         w => [],
  mintPOAP_str:     w => [nextName()],
};

/* ---------- 状态 ---------- */
let provider = null, signer = null, connAddr = null;
let mode = 'A';
let running = false, stopFlag = false;
let stats = { total: 0, ok: 0, fail: 0, run: 0 };
let failList = [];
let nameIdx = 0;

/* ---------- 工具 ---------- */
function ts() { return new Date().toLocaleTimeString('zh-CN', { hour12: false }); }
function log(msg, cls = '') {
  const box = $('logBox');
  const line = document.createElement('div');
  line.innerHTML = `<span class="t">[${ts()}]</span> <span class="${cls}">${msg}</span>`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
function qtyArg() { return parseInt($('qtyArg').value || '1', 10); }
function callsPerWallet() { return parseInt($('callsPerWallet').value || '1', 10); }
function nextName() {
  const list = $('namesList').value.split('\n').map(s => s.trim()).filter(Boolean);
  const n = list[nameIdx] || `Wallet-${nameIdx + 1}`;
  nameIdx++;
  return n;
}
function setStat(k, v) { stats[k] = v; $('st' + {total:'Total',ok:'Ok',fail:'Fail',run:'Run'}[k]).textContent = v; }
function setProg(done, total) {
  const pct = total ? Math.round(done / total * 100) : 0;
  $('progFill').style.width = pct + '%';
  $('progPct').textContent = pct + '%';
  $('progText').textContent = `${done} / ${total}`;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function currentChain() {
  const c = CHAINS[parseInt($('chainSel').value, 10)];
  return { ...c, rpc: $('rpcUrl').value.trim() || c.rpc, chainId: parseInt($('rpcChainId').value || c.id, 10) };
}
function chainHex(id) { return '0x' + id.toString(16); }

/* ---------- 预设 ---------- */
function applyContractPreset() {
  const v = $('contractPreset').value;
  if (v === 'poap') {
    $('chainSel').value = '0';
    $('rpcUrl').value = 'https://sepolia-rpc.giwa.io';
    $('rpcChainId').value = '91342';
    $('explorer').value = '';
    $('symbol').value = 'GIWA';
    $('contractAddr').value = '0x8Cd7207d60D236F2b71c7AD677fcd45053Da0d1c';
    $('fnSel').value = 'mintPOAP_str';
    $('qtyArg').value = '1';
    $('callsPerWallet').value = '1';
    $('valueEth').value = '0';
    $('nameRow').classList.remove('hidden');
  } else if (v === 'ia') {
    $('chainSel').value = '1';
    $('rpcUrl').value = 'https://rpc.mainnet.chain.robinhood.com';
    $('rpcChainId').value = '4663';
    $('explorer').value = '';
    $('symbol').value = 'ROBIN';
    $('contractAddr').value = '0xD982d8F175BD50B976F4Ad90562c9e38200091f9';
    log('⚠️ Inference Angels 需要先解谜（commit/reveal 两步），本页无法直接批量 mint，仅作地址占位。', 'warn');
  }
  saveCfg();
}
function onFnChange() {
  const custom = $('fnSel').value === 'custom';
  $('customAbiRow').classList.toggle('hidden', !custom);
  $('nameRow').classList.toggle('hidden', $('fnSel').value !== 'mintPOAP_str');
}

/* ---------- 配置持久化 ---------- */
function saveCfg() {
  const c = currentChain();
  const cfg = {
    chainIdx: $('chainSel').value, rpcUrl: c.rpc, chainId: c.chainId,
    explorer: $('explorer').value, symbol: $('symbol').value,
    contract: $('contractAddr').value, fn: $('fnSel').value,
    qty: $('qtyArg').value, calls: $('callsPerWallet').value, conc: $('concurrency').value,
    value: $('valueEth').value, gasMult: $('gasMult').value,
    customAbi: $('customAbi').value, customFn: $('customFn').value, customArgs: $('customArgs').value,
  };
  try { localStorage.setItem('mintbot_cfg', JSON.stringify(cfg)); } catch (e) {}
}
function loadCfg() {
  try {
    const cfg = JSON.parse(localStorage.getItem('mintbot_cfg') || 'null');
    if (!cfg) return;
    $('chainSel').value = cfg.chainIdx || '0';
    $('rpcUrl').value = cfg.rpcUrl || '';
    $('rpcChainId').value = cfg.chainId || '';
    $('explorer').value = cfg.explorer || '';
    $('symbol').value = cfg.symbol || '';
    $('contractAddr').value = cfg.contract || '';
    $('fnSel').value = cfg.fn || 'mint_uint';
    $('qtyArg').value = cfg.qty || '1';
    $('callsPerWallet').value = cfg.calls || '1';
    $('concurrency').value = cfg.conc || '5';
    $('valueEth').value = cfg.value || '0';
    $('gasMult').value = cfg.gasMult || '1.2';
    $('customAbi').value = cfg.customAbi || '';
    $('customFn').value = cfg.customFn || '';
    $('customArgs').value = cfg.customArgs || '';
    onFnChange();
  } catch (e) {}
}

/* ---------- UI 事件 ---------- */
function initUI() {
  const sel = $('chainSel');
  CHAINS.forEach((c, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = c.name;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => {
    const c = CHAINS[parseInt(sel.value, 10)];
    if (c.id !== 0) {
      $('rpcUrl').value = c.rpc; $('rpcChainId').value = c.id;
      $('explorer').value = c.explorer; $('symbol').value = c.symbol;
      $('customRpcRow').classList.add('hidden');
    } else {
      $('customRpcRow').classList.remove('hidden');
    }
    saveCfg();
  });
  sel.dispatchEvent(new Event('change'));
  loadCfg();

  ['rpcUrl','rpcChainId','explorer','symbol','contractAddr','qtyArg','callsPerWallet','concurrency','valueEth','gasMult','customAbi','customFn','customArgs','namesList','keysList']
    .forEach(id => $(id).addEventListener('input', saveCfg));

  $('contractPreset').addEventListener('change', applyContractPreset);
  $('fnSel').addEventListener('change', () => { onFnChange(); saveCfg(); });

  $('modeA').addEventListener('click', () => setMode('A'));
  $('modeB').addEventListener('click', () => setMode('B'));
  $('testBtn').addEventListener('click', testRpc);
  $('startBtn').addEventListener('click', startRun);
  $('stopBtn').addEventListener('click', () => { stopFlag = true; log('⏹ 收到停止信号，等待当前批次完成…', 'warn'); });
  $('clearLogBtn').addEventListener('click', () => { $('logBox').innerHTML = ''; });
  $('copyFailBtn').addEventListener('click', () => {
    if (!failList.length) { log('没有失败记录', 'dim'); return; }
    navigator.clipboard.writeText(failList.join('\n')).then(() => log(`📋 已复制 ${failList.length} 条失败记录`, 'ok'));
  });
  $('connBtn').addEventListener('click', connectWallet);
}

function setMode(m) {
  mode = m;
  $('modeA').classList.toggle('active', m === 'A');
  $('modeB').classList.toggle('active', m === 'B');
  $('keysRow').classList.toggle('hidden', m !== 'B');
  log(`模式：${m === 'A' ? '🔗 连接钱包（单钱包顺序执行）' : '📦 批量私钥（每钱包各自 mint，钱包间并行）'}`, 'info');
}

/* ---------- RPC / 钱包 ---------- */
function makeProvider() {
  const c = currentChain();
  if (!c.rpc) throw new Error('请填写 RPC URL');
  return new ethers.JsonRpcProvider(c.rpc, c.chainId, { staticNetwork: true });
}
async function testRpc() {
  try {
    const p = makeProvider();
    const [bn, net] = await Promise.all([p.getBlockNumber(), p.getNetwork()]);
    log(`✅ RPC 正常：链 ${net.chainId}，区块高度 ${bn}`, 'ok');
  } catch (e) {
    log(`❌ RPC 连接失败：${e.message || e}`, 'err');
  }
}
async function connectWallet() {
  if (typeof window.ethereum === 'undefined') {
    log('❌ 未检测到钱包（MetaMask 等）。批量私钥模式不需要钱包。', 'err');
    return;
  }
  try {
    const p = new ethers.BrowserProvider(window.ethereum);
    const accs = await p.send('eth_requestAccounts', []);
    connAddr = accs[0];
    const c = currentChain();
    const net = await p.getNetwork();
    if (net.chainId !== BigInt(c.chainId)) {
      try {
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: chainHex(c.chainId) }] });
      } catch (err) {
        if (err.code === 4902) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{ chainId: chainHex(c.chainId), chainName: c.name, rpcUrls: [c.rpc], nativeCurrency: { name: c.symbol || 'ETH', symbol: c.symbol || 'ETH', decimals: 18 } }],
          });
        } else throw err;
      }
    }
    signer = await p.getSigner();
    provider = p;
    connAddr = (await signer.getAddress()).toLowerCase();
    $('connBtn').innerHTML = `<span class="dot"></span>${connAddr.slice(0, 6)}…${connAddr.slice(-4)}`;
    $('connBtn').classList.add('connected');
    log(`✅ 已连接钱包：${connAddr}`, 'ok');
  } catch (e) {
    log(`❌ 连接失败：${e.message || e}`, 'err');
  }
}

/* ---------- 解析批量私钥 ---------- */
function parseKeys(text) {
  const keys = [];
  text.split('\n').forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('#')) return;
    let k = line;
    const comma = line.indexOf(',');
    if (comma > 0) k = line.slice(0, comma).trim();
    if (!/^(0x)?[0-9a-fA-F]{64}$/.test(k)) return;
    keys.push(k.startsWith('0x') ? k : '0x' + k);
  });
  return keys;
}

/* ---------- 构建任务（按钱包分组：钱包内顺序，钱包间并行） ---------- */
function buildJobs() {
  const fnKey = $('fnSel').value;
  const addr = $('contractAddr').value.trim();
  if (!ethers.isAddress(addr)) throw new Error('合约地址格式不正确');

  const abiArr = fnKey === 'custom'
    ? JSON.parse($('customAbi').value || '[]')
    : FN_ABI[fnKey];
  const fnName = fnKey === 'custom' ? ($('customFn').value.trim() || 'mint')
    : (fnKey === 'mint_uint' || fnKey === 'mint_uint_addr' || fnKey === 'mint_addr_uint') ? 'mint'
    : fnKey === 'publicMint_uint' ? 'publicMint'
    : fnKey === 'mintPOAP_str' ? 'mintPOAP'
    : fnKey;
  if (fnKey === 'custom' && !Array.isArray(abiArr)) throw new Error('自定义 ABI 必须是 JSON 数组');

  const argsFn = fnKey === 'custom'
    ? (w) => JSON.parse($('customArgs').value || '[]')
    : FN_ARGS[fnKey];
  if (fnKey === 'custom') {
    try { JSON.parse($('customArgs').value || '[]'); } catch (e) { throw new Error('自定义参数 JSON 格式错误'); }
  }

  const valueWei = ethers.parseEther(($('valueEth').value || '0').toString());
  const mult = parseFloat($('gasMult').value || '1.2');
  const n = callsPerWallet();

  let wallets;
  if (mode === 'A') {
    if (!signer) throw new Error('请先连接钱包（或切换到批量私钥模式）');
    wallets = [{ signer, addr: connAddr }];
  } else {
    const keys = parseKeys($('keysList').value);
    if (!keys.length) throw new Error('未解析到有效私钥（每行一个 0x64 位）');
    const p = makeProvider();
    wallets = keys.map(k => {
      const w = new ethers.Wallet(k, p);
      return { signer: w, addr: w.address.toLowerCase() };
    });
  }

  const jobs = [];
  nameIdx = 0; // 名字列表在整个任务队列中顺序消费
  wallets.forEach((w) => {
    const tasks = [];
    for (let i = 0; i < n; i++) {
      let args;
      try { args = argsFn(w.addr); } catch (e) { throw new Error(`参数生成失败：${e.message}`); }
      tasks.push({ args, valueWei, mult, fnName, abiArr, contractAddr: addr });
    }
    jobs.push({ signer: w.signer, addr: w.addr, label: `${w.addr.slice(0, 6)}…${w.addr.slice(-4)}`, tasks });
  });
  return jobs;
}

/* ---------- 单笔 mint ---------- */
async function sendOne(signer, t) {
  const c = currentChain();
  const iface = new ethers.Interface(t.abiArr);
  if (!iface.getFunction(t.fnName)) throw new Error(`合约 ABI 中没有函数 ${t.fnName}`);
  const contract = new ethers.Contract(t.contractAddr, t.abiArr, signer);

  const overrides = { value: t.valueWei };
  const fd = await signer.provider.getFeeData();
  if (fd.maxFeePerGas) {
    overrides.maxFeePerGas = (fd.maxFeePerGas * BigInt(Math.round(t.mult * 100))) / 100n;
    if (fd.maxPriorityFeePerGas) overrides.maxPriorityFeePerGas = (fd.maxPriorityFeePerGas * BigInt(Math.round(t.mult * 100))) / 100n;
  } else if (fd.gasPrice) {
    overrides.gasPrice = (fd.gasPrice * BigInt(Math.round(t.mult * 100))) / 100n;
  }

  // gasLimit：先估算，失败则回退 300k
  try {
    const est = await contract.getFunction(t.fnName).estimateGas(...t.args, overrides);
    overrides.gasLimit = est + 20000n;
  } catch (e) {
    overrides.gasLimit = 300000n;
  }

  const tx = await contract.getFunction(t.fnName)(...t.args, overrides);
  const receipt = await tx.wait();
  if (receipt.status !== 1) throw new Error('交易回滚 (status=0)');
  return receipt;
}

/* ---------- 主循环 ---------- */
async function startRun() {
  if (running) return;
  saveCfg();
  try {
    if (typeof ethers === 'undefined') throw new Error('ethers.js 加载失败，请检查网络');
    if (mode === 'B') provider = makeProvider();

    const jobs = buildJobs();
    if (!jobs.length) throw new Error('没有可执行的任务');
    const total = jobs.reduce((s, j) => s + j.tasks.length, 0);
    running = true; stopFlag = false;
    failList = [];
    nameIdx = 0;
    Object.keys(stats).forEach(k => setStat(k, 0));
    setStat('total', total);
    setProg(0, total);
    $('startBtn').disabled = true;
    $('stopBtn').classList.remove('hidden');
    log(`🚀 开始批量 mint：${jobs.length} 个钱包 / 共 ${total} 笔（${mode === 'A' ? '连接钱包' : '批量私钥'}，并发 ${$('concurrency').value}）`, 'info');
    log(`   合约 ${jobs[0].tasks[0].contractAddr} ｜ 函数 ${jobs[0].tasks[0].fnName} ｜ value ${ethers.formatEther(jobs[0].tasks[0].valueWei)} ${currentChain().symbol || ''}`, 'dim');

    const conc = Math.max(1, parseInt($('concurrency').value, 10));
    const queue = [...jobs];
    const workers = [];
    for (let i = 0; i < Math.min(conc, queue.length); i++) {
      workers.push((async () => {
        while (queue.length && !stopFlag) {
          const job = queue.shift();
          if (!job) break;
          for (const t of job.tasks) {
            if (stopFlag) break;
            setStat('run', stats.run + 1);
            log(`⏳ [${job.label}] 发送 ${t.fnName}(${t.args.map(a => typeof a === 'string' && a.length > 12 ? a.slice(0, 6) + '…' + a.slice(-4) : a).join(', ')}) …`, '');
            try {
              const receipt = await sendOne(job.signer, t);
              setStat('ok', stats.ok + 1);
              setStat('run', stats.run - 1);
              const exp = $('explorer').value.trim();
              const link = exp ? `<a href="${exp}/tx/${receipt.hash}" target="_blank" style="color:var(--ok)">${receipt.hash.slice(0, 10)}…</a>` : receipt.hash.slice(0, 10) + '…';
              log(`✅ [${job.label}] 成功 tx ${link}`, 'ok');
            } catch (e) {
              setStat('fail', stats.fail + 1);
              setStat('run', stats.run - 1);
              failList.push(`${job.label}\t${t.args.map(a => String(a)).join(',')}\t${e.message || e}`);
              log(`❌ [${job.label}] 失败：${(e.message || e).slice(0, 140)}`, 'err');
            }
            setProg(stats.ok + stats.fail, total);
            await sleep(60);
          }
        }
      })());
    }
    await Promise.all(workers);
    running = false;
    setStat('run', 0);
    $('startBtn').disabled = false;
    $('stopBtn').classList.add('hidden');
    setProg(stats.ok + stats.fail, total);
    log(`🏁 完成：成功 ${stats.ok} / 失败 ${stats.fail}${stopFlag ? '（已手动停止）' : ''}`, stats.fail ? (stats.ok ? 'warn' : 'err') : 'ok');
  } catch (e) {
    running = false;
    $('startBtn').disabled = false;
    $('stopBtn').classList.add('hidden');
    log(`⛔ 启动失败：${e.message || e}`, 'err');
  }
}

initUI();
log('⚡ MINTBOT 就绪。选择网络/合约 → 配置函数与数量 → 开始。', 'info');
/* ethers 加载状态轮询（最多 ~12s） */
(function waitEthers() {
  if (typeof ethers !== 'undefined') {
    log('✅ ethers.js 加载完成，可以开始。', 'ok');
    return;
  }
  let tries = 0;
  const t = setInterval(() => {
    tries++;
    if (typeof ethers !== 'undefined') {
      clearInterval(t);
      log('✅ ethers.js 加载完成，可以开始。', 'ok');
    } else if (tries > 24) {
      clearInterval(t);
      log('❌ ethers.js 加载失败：请检查网络（CDN 被墙时换本地网络/代理重试）。', 'err');
    }
  }, 500);
})();
</script>
