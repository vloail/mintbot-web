name: fetch-spawnhood
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch-spawnhood.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright + ws
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright-core ws >/dev/null 2>&1
          npx playwright-core install chromium --with-deps >/dev/null 2>&1 || true
      - name: Fetch API endpoints
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          curl -sL --max-time 30 -A "$UA" "https://spawnhood.com/api/stats" -o data/spawnhood-api-stats.json; echo "stats: $(cat data/spawnhood-api-stats.json | head -c 400)"
          echo
          curl -sL --max-time 30 -A "$UA" "https://spawnhood.com/api/prices/config" -o data/spawnhood-api-prices.json; echo "prices: $(cat data/spawnhood-api-prices.json | head -c 600)"
          echo
          curl -sL --max-time 30 -A "$UA" "https://spawnhood.com/api/deploy/config" -o data/spawnhood-api-deploy.json; echo "deploy: $(cat data/spawnhood-api-deploy.json | head -c 600)"
          echo
          wc -c data/spawnhood-api-*.json
      - name: WS protocol probe (join + attack)
        run: |
          node -e "
          const WebSocket = require('ws');
          const fs = require('fs');
          const url = 'wss://spawnhood.com/ws';
          const pid = '0x35706ff1754f6291ccdb8ae6f29131b358a4d59b';
          const out = [];
          const t0 = Date.now();
          const log = (s) => out.push({ ms: Date.now() - t0, s: String(s).slice(0, 3000) });
          let attacks = 0;
          const ws = new WebSocket(url);
          ws.on('open', () => {
            log('OPEN');
            ws.send(JSON.stringify({ t: 'join', pid, name: 'probe', pool: 'primordial-ooze' }));
          });
          ws.on('message', d => {
            const s = d.toString();
            log('RECV ' + s);
            try {
              const j = JSON.parse(s);
              if (j.t === 'joined') {
                // send a few attacks to trigger hit detection
                for (let i = 0; i < 6; i++) {
                  setTimeout(() => { ws.send(JSON.stringify({ t: 'attack' })); attacks++; }, 800 * (i + 1));
                }
              }
              if (j.t === 'world') {
                // mirror a moving player: report position near center + attack periodically
                const x = Math.round(500 + Math.sin(Date.now() / 500) * 200);
                const y = Math.round(400 + Math.cos(Date.now() / 600) * 150);
                ws.send(JSON.stringify({ t: 'state', x, y, angle: 0.5, moving: true, frame: 1 }));
                if (attacks < 12) { ws.send(JSON.stringify({ t: 'attack' })); attacks++; }
              }
            } catch (e) {}
          });
          ws.on('close', () => { log('CLOSE'); fs.writeFileSync('data/spawnhood-ws.json', JSON.stringify(out, null, 1)); console.log('WS EVENTS:', out.length); process.exit(0); });
          ws.on('error', e => { log('ERR ' + e.message); });
          setTimeout(() => { try { ws.close(); } catch (e) {} }, 45000);
          "
          echo "---"; wc -c data/spawnhood-ws.json 2>/dev/null || true
      - name: Commit results
        run: |
          git config user.name "vloail"
          git config user.email "vloail@users.noreply.github.com"
          git add data/ || true
          git commit -m "fetch: spawnhood APIs + ws probe" || echo "no changes"
          git push origin main || echo "push failed"
