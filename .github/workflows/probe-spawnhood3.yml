name: probe-spawnhood3
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-spawnhood3.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ws
        run: npm init -y >/dev/null 2>&1 && npm i ws >/dev/null 2>&1
      - name: Long join retry + spectate probe
        run: |
          mkdir -p data
          node -e "
          const WebSocket = require('ws');
          const fs = require('fs');
          const POOLS = ['primordial-ooze','fairy-lake','dungeon-dam','ravens-nest','creature-swamp','babblin-brook'];
          const PID = '0x35706ff1754f6291ccdb8ae6f29131b358a4d59b';
          const out = [];
          const t0 = Date.now();
          const log = (tag, s) => out.push({ ms: Date.now() - t0, tag, s: String(s).slice(0, 3000) });
          let attempt = 0, joined = false, ws = null, lastWorld = null, sentMint = false, claimNftId = null, mintReqSent = false;

          function connect() {
            attempt++;
            const pool = POOLS[attempt % POOLS.length];
            const mode = attempt % 4 === 0 ? 'spectate' : 'join';
            ws = new WebSocket('wss://spawnhood.com/ws');
            ws.on('open', () => {
              if (mode === 'spectate') { ws.send(JSON.stringify({ t: 'spectate', pool })); log('send', 'spectate ' + pool); }
              else { ws.send(JSON.stringify({ t: 'join', pid: PID, name: 'hood' + attempt, pool })); log('send', 'join ' + pool); }
            });
            ws.on('message', d => {
              const s = d.toString();
              let j; try { j = JSON.parse(s); } catch (e) { log('raw', s.slice(0, 300)); return; }
              if (j.t !== 'world') log('msg', s.slice(0, 800));
              switch (j.t) {
                case 'full':
                case 'pool_full':
                  log(j.t, 'retry in 8s');
                  setTimeout(() => { try { ws.close(); } catch(e){} setTimeout(connect, 3000); }, 8000);
                  break;
                case 'joined':
                  joined = true; log('joined', 'IN! genesisMinted=' + j.genesisMinted + ' color=' + j.color);
                  break;
                case 'spectating':
                  joined = true; log('spectating', 'SPECTATOR IN! genesisMinted=' + j.genesisMinted);
                  break;
                case 'world':
                  lastWorld = j;
                  if (out.filter(o=>o.tag==='world').length < 5) log('world', JSON.stringify(j).slice(0, 2500));
                  break;
                case 'hit': log('hit', s); break;
                case 'claim':
                  claimNftId = j.nft && j.nft.nftId;
                  log('claim', JSON.stringify(j.nft).slice(0, 800));
                  break;
                case 'claim_choice':
                  log('claim_choice', s.slice(0, 800));
                  if (j.options && j.options.length && !mintReqSent) {
                    mintReqSent = true;
                    ws.send(JSON.stringify({ t: 'claim_pick', nftId: j.options[0].nftId }));
                    log('claim_pick', String(j.options[0].nftId));
                  }
                  break;
                case 'voucher':
                  log('VOUCHER', s);
                  break;
                case 'mint_result': log('mint_result', s); break;
                case 'minted': log('minted', s.slice(0, 500)); break;
                case 'eaten': case 'exploded': case 'gem': case 'milestone': log(j.t, s.slice(0, 300)); break;
              }
            });
            ws.on('close', () => { if (joined) { log('close', 'reconnect'); joined = false; setTimeout(connect, 2000); } });
            ws.on('error', e => { log('err', e.message.slice(0, 120)); setTimeout(connect, 3000); });
          }

          // movement + attack
          setInterval(() => {
            if (!joined || !ws || ws.readyState !== 1 || !lastWorld) return;
            const now = Date.now();
            const es = (lastWorld.enemies || []).filter(e => e.ttl > 0);
            let target = null, best = 1e18;
            for (const e of es) {
              const d = (e.x - 500) ** 2 + (e.y - 400) ** 2;
              if (d < best) { best = d; target = e; }
            }
            let x = 500, y = 400, angle = 0.5, moving = false;
            if (target) {
              const dx = target.x - x, dy = target.y - y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              angle = Math.atan2(dy, dx);
              if (dist > 60) { const sp = Math.min(4, dist); x = Math.round(x + dx / dist * sp); y = Math.round(y + dy / dist * sp); moving = true; }
            }
            ws.send(JSON.stringify({ t: 'state', x, y, angle: +angle.toFixed(2), moving, frame: Math.round(now / 100) }));
            if (now - lastAttack > 500) { lastAttack = now; ws.send(JSON.stringify({ t: 'attack' })); }
          }, 100);
          let lastAttack = 0;

          // on claim request mint
          setInterval(() => {
            if (claimNftId != null && !mintReqSent && joined && ws && ws.readyState === 1) {
              mintReqSent = true;
              ws.send(JSON.stringify({ t: 'mint', nftId: claimNftId }));
              log('mint_req', 'nftId=' + claimNftId);
            }
          }, 1000);

          connect();
          setTimeout(() => {
            try { ws.close(); } catch(e){}
            fs.writeFileSync('data/spawnhood-ws4.json', JSON.stringify(out, null, 1));
            const tags = {}; out.forEach(o => tags[o.tag] = (tags[o.tag] || 0) + 1);
            console.log('EVENTS', out.length, JSON.stringify(tags));
            process.exit(0);
          }, 1200000);
          "
          wc -c data/spawnhood-ws4.json
      - name: Commit results
        run: |
          git config user.name "vloail"
          git config user.email "vloail@users.noreply.github.com"
          git add data/spawnhood-ws4.json || true
          git commit -m "probe3: long join retry" || echo "no changes"
          git push origin main || echo "push failed"
