name: fetch-opensea
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'OpenSea collection slug (e.g. outlandersonrh)'
        required: false
        default: 'outlandersonrh'
  push:
    paths: ['.github/workflows/fetch-opensea.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SLUG: ${{ inputs.slug || 'outlandersonrh' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenSea collection page
        run: |
          mkdir -p opensea_data
          curl -sL --max-time 40 "https://opensea.io/collection/${SLUG}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -H "Accept: text/html" -o opensea_data/page.html || true
          wc -c opensea_data/page.html || true
      - name: Parse to JSON
        run: |
          python3 scripts/parse_opensea.py opensea_data/page.html "opensea_data/${SLUG}.json" || echo "parse failed"
          ls -la opensea_data/
      - name: Commit results
        run: |
          git config user.name "vloail"
          git config user.email "vloail@users.noreply.github.com"
          git add opensea_data/ || true
          git commit -m "fetch: opensea ${SLUG}" || echo "no changes to commit"
          git push origin main || echo "push failed"
